name: bi_banque
description: "Plateforme mobile de BI et d'aide à la décision bancaire."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  fl_chart: ^1.3.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

  # Outils de génération (utilisés uniquement au développement)
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

# Icône de l'application (Android et iOS)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D2144"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

# Écran de démarrage
flutter_native_splash:
  color: "#0D2144"
  image: assets/icon/splash_logo.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0D2144"
    image: assets/icon/splash_logo.png